<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vokabeltrainer</title>
  
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes"> 
  
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" sizes="192x192" href="icon-192.png">
  <link rel="icon" sizes="512x512" href="icon-512.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
   <h1>🎓 English Coach <span id="sessionProgress" class="progress-info"></span></h1>
    <div class="toolbar">
      <label>Modus:
<select id="modeSelect">
  <option value="de2en">Deutsch → Englisch</option>
  <option value="en2de">Englisch → Deutsch</option>
  <option value="sentences">📖 Satztrainer</option>
</select>
      </label>
      
      <button id="installBtn" class="secondary hidden">📲 App installieren</button> 
      
      <label><input id="mcEnabled" type="checkbox"> Multiple Choice</label>
      <label><input id="weightedEnabled" type="checkbox" checked> Fehlergewichtung</label>
      <label><input id="hintsEnabled" type="checkbox"> Lern‑Hinweise (Beta)</label>
      <label>Preset:
        <select id="presetSelect">
          <option value="custom">(individuell)</option>
          <option value="u1_2">U1–U2</option>
          <option value="u1_3">U1–U3</option>
          <option value="u3_4">U3–U4</option>
          <option value="u1_6">U1–U6</option>
        </select>
      </label>
    </div>
  </header>
  <main id="app-root">
    <section class="card">
<div class="exercise-header">
  <div class="player-panel">

    <div class="player-progress">

    🏁 Fortschritt

    <span id="progressCounter">
        0 / 97
    </span>

</div>

    <div class="player-level">
        ⭐ Level 1
    </div>

    <div class="xp-bar">
        <div class="xp-fill"></div>
    </div>

    <div class="xp-text">
      <div class="future-rewards">

    🎴 Kartenpacks: 0

    &nbsp;&nbsp;&nbsp;

    🏆 Erfolge: 0

</div>
      <div class="achievement-list">

    <h3>🏆 Erfolge</h3>

    <div id="achievementList"></div>

</div>
        XP: 0 / 100
    </div>

</div>
    <div id="exerciseType" class="exercise-type">
        📚 Vokabeltrainer
    </div>

    <div id="exerciseDescription" class="exercise-description">
        Übersetze das Wort.
    </div>
</div>

<div>
  <span id="promptLabel">Deutsch</span>
</div>
      <div id="promptText">Wähle mindestens einen Block und starte.</div>
      <div id="mcArea" class="mc hidden"><ul id="optionsList"></ul></div>
      <div id="feedback" class="feedback"></div>
      <div id="achievementPopup" class="achievement-popup hidden">
    <div class="achievement-title">
        🏆 Achievement freigeschaltet!
    </div>

    <div id="achievementName"></div>

    <div id="achievementDescription"></div>
</div>
      <div id="hintArea" class="hint hidden"></div>
      <div class="actions">
        <button id="checkBtn" class="secondary hidden">Prüfen</button> 
        <button id="showAnswerBtn" class="secondary hidden">Lösung anzeigen</button>
        <button id="nextBtn" class="primary">Start</button> 
      </div>
    </section>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
  <script src="app-inline.js"></script>
<footer class="app-footer">
    <div class="tip-jar">
        <a href="https://paypal.me/Maxxl86" target="_blank" rel="noopener noreferrer" class="tip-button">
            ☕ Meine Arbeit honorieren
        </a>
    </div>
    <div class="version-info">App-Version: <span id="appVersion"></span></div>
</footer></body>
</html>
